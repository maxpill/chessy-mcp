[project]
name = "chessy-mcp"
version = "0.1.0"
description = "Standalone Stockfish MCP server — the chessy app's chess engine backend, deployed independently at mcp.trychessy.com."
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "mcp>=2.0.0",
    "uvicorn[standard]>=0.34",
    "structlog>=24.4",
    "uvloop>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.23.1",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "RUF"]

[tool.pyright]
include = ["mcp_server", "core", "tests"]
pythonVersion = "3.13"
strict = ["mcp_server", "core"]