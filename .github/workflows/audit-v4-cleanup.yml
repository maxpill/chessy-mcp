name: Apply audit v4 cleanup

on:
  push:
    branches:
      - fix/chess-mcp-ultra-audit-2026-08-30

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[audit-v4-cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply cleanup
        run: python scripts/apply_audit_v4_cleanup.py
      - name: Compile
        run: python -m compileall -q mcp_server core
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- mcp_server core; then
            echo "No cleanup changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_server core
          git commit -m "fix: strict lint cleanup [audit-v4-cleanup-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
