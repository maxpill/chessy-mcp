name: Apply server strict typing fixes

on:
  push:
    branches:
      - fix/chess-mcp-ultra-audit-2026-08-30

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[server-pyright-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply server typing fixes
        run: python scripts/apply_pyright_server_fix.py
      - name: Compile
        run: python -m compileall -q mcp_server/server.py
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet -- mcp_server/server.py; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_server/server.py
          git commit -m "fix: satisfy strict typing in MCP server [server-pyright-fix-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
