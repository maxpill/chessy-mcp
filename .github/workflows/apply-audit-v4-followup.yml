name: Apply audit v4 follow-up

on:
  push:
    branches:
      - fix/chess-mcp-ultra-audit-2026-08-30
    paths:
      - scripts/apply_audit_v4_followup.py
      - .github/workflows/apply-audit-v4-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STOCKFISH_PATH: /usr/games/stockfish
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chess-mcp-ultra-audit-2026-08-30

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv and Stockfish
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          test -x "$STOCKFISH_PATH"
          uv sync --frozen --dev

      - name: Apply follow-up fixes
        run: python scripts/apply_audit_v4_followup.py

      - name: Compile
        run: uv run python -m compileall -q mcp_server core tests

      - name: Follow-up regressions
        run: uv run pytest -q tests/test_audit_v4_followup.py

      - name: Full pytest
        run: uv run pytest -q

      - name: Ruff
        run: uv run ruff check mcp_server core

      - name: Strict Pyright
        run: uv run pyright mcp_server core

      - name: Commit verified follow-up fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp_server/cache.py mcp_server/rules.py mcp_server/server.py core/engines/analysis.py core/engines/analyzer.py core/engines/pool.py tests/test_audit_v4_followup.py
          if git diff --cached --quiet; then
            echo 'No follow-up changes to commit.'
            exit 0
          fi
          git commit -m 'fix: close remaining audit v4 semantic gaps'
          git push origin HEAD:fix/chess-mcp-ultra-audit-2026-08-30
