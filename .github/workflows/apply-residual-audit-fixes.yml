name: Apply residual audit fixes

on:
  push:
    branches:
      - test/chess-mcp-ultra-stress-v5-2026-08-30

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[residual-audit-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/chess-mcp-ultra-stress-v5-2026-08-30
      - name: Apply residual findings from audits v1-v4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, got {count}")
              return text.replace(old, new, 1)

          # 1. Transport security settings.
          p = Path('mcp_server/config.py')
          s = p.read_text(encoding='utf-8')
          marker = 'CHESS_MCP_DNS_REBINDING_PROTECTION'
          if marker not in s:
              old = '''    # When true, every non-health HTTP request must present the configured\n    # token. User-Agent and Origin strings are never treated as credentials.\n    lock_chatgpt: bool = Field(default=False, validation_alias="CHESS_MCP_LOCK_CHATGPT")\n'''
              new = old + '''\n    # MCP transport DNS-rebinding protection. Enabled by default for HTTP.\n    # Host/Origin allowlists use the exact and `host:*` wildcard-port semantics\n    # implemented by the official MCP Python SDK.\n    dns_rebinding_protection: bool = Field(\n        default=True, validation_alias="CHESS_MCP_DNS_REBINDING_PROTECTION"\n    )\n    allowed_hosts: str = Field(\n        default="localhost:*,127.0.0.1:*,[::1]:*,testserver,testserver:*",\n        validation_alias="CHESS_MCP_ALLOWED_HOSTS",\n    )\n    allowed_origins: str = Field(\n        default="", validation_alias="CHESS_MCP_ALLOWED_ORIGINS"\n    )\n'''
              s = replace_once(s, old, new, 'config transport security')
              p.write_text(s, encoding='utf-8')

          # 2. Server: DNS rebinding, trailing-PGN contract, nested candidate identity.
          p = Path('mcp_server/server.py')
          s = p.read_text(encoding='utf-8')

          # Parser candidate gets an explicit tolerance flag.
          old = 'def _parse_pgn_game_candidate(text: str, strict: bool = False) -> chess.pgn.Game | None:\n'
          new = '''def _parse_pgn_game_candidate(\n    text: str,\n    strict: bool = False,\n    allow_trailing_after_terminal: bool = False,\n) -> chess.pgn.Game | None:\n'''
          if old in s:
              s = replace_once(s, old, new, 'parse candidate signature')

          old = '''            if game.errors:\n                b = game.board()\n                reached_game_over = False\n                for node in game.mainline():\n                    b.push(node.move)\n                    if b.is_game_over(claim_draw=False):\n                        reached_game_over = True\n                        break\n                if not reached_game_over:\n                    raise ValueError(\n                        f"Invalid PGN syntax or illegal move in game: {game.errors[0]}"\n                    )\n'''
          new = '''            if game.errors:\n                b = game.board()\n                reached_game_over = False\n                for node in game.mainline():\n                    b.push(node.move)\n                    if b.is_game_over(claim_draw=False):\n                        reached_game_over = True\n                        break\n                if reached_game_over:\n                    if not allow_trailing_after_terminal:\n                        raise ValueError(\n                            "INVALID_PGN: Movetext contains moves after automatic game termination."\n                        )\n                else:\n                    raise ValueError(\n                        f"INVALID_PGN: Invalid PGN syntax or illegal move in game: {game.errors[0]}"\n                    )\n'''
          if old in s:
              s = replace_once(s, old, new, 'game.errors trailing terminal')

          old = '''def _extract_game(text: str, strict: bool = False) -> chess.pgn.Game:\n    """Extract a chess.pgn.Game from raw, dirty, annotated, or conversational text."""\n    _check_multiple_games(text)\n    canonical = _extract_canonical_pgn_text(text)\n    return _extract_game_inner(canonical, strict=strict)\n\n\ndef _extract_game_inner(cleaned: str, strict: bool = False) -> chess.pgn.Game:\n'''
          new = '''def _extract_game(\n    text: str,\n    strict: bool = False,\n    allow_trailing_after_terminal: bool = False,\n) -> chess.pgn.Game:\n    """Extract one game and reject hidden post-terminal moves by default."""\n    _check_multiple_games(text)\n    canonical = _extract_canonical_pgn_text(text)\n    return _extract_game_inner(\n        canonical,\n        strict=strict,\n        allow_trailing_after_terminal=allow_trailing_after_terminal,\n    )\n\n\ndef _extract_game_inner(\n    cleaned: str,\n    strict: bool = False,\n    allow_trailing_after_terminal: bool = False,\n) -> chess.pgn.Game:\n'''
          if old in s:
              s = replace_once(s, old, new, 'extract signatures')

          # Every parser call inside _extract_game_inner must carry the tolerance contract.
          s = s.replace(
              '_parse_pgn_game_candidate(norm_text, strict=strict)',
              '_parse_pgn_game_candidate(\n            norm_text,\n            strict=strict,\n            allow_trailing_after_terminal=allow_trailing_after_terminal,\n        )',
          )
          s = s.replace(
              '_parse_pgn_game_candidate(sub_movetext, strict=strict)',
              '_parse_pgn_game_candidate(\n                sub_movetext,\n                strict=strict,\n                allow_trailing_after_terminal=allow_trailing_after_terminal,\n            )',
          )

          # _build_board must actually forward strict mode to PGN parsing.
          if 'game = _extract_game(cleaned)\n' in s:
              s = replace_once(
                  s,
                  '        game = _extract_game(cleaned)\n',
                  '        game = _extract_game(cleaned, strict=strict)\n',
                  'build_board strict forwarding',
              )

          # analyze_game alone intentionally tolerates post-terminal junk in permissive mode,
          # then reports it through the existing ignored-trailing warning. Strict rejects it.
          if '        game = _extract_game_inner(canonical_pgn)\n' in s:
              s = replace_once(
                  s,
                  '        game = _extract_game_inner(canonical_pgn)\n',
                  '''        game = _extract_game_inner(\n            canonical_pgn,\n            strict=strict,\n            allow_trailing_after_terminal=not strict,\n        )\n''',
                  'analyze_game parser contract',
              )

          # Stamp nested top-move candidates with the same immutable analysis identity.
          identity_needle = '''                        "recommended_action": "game_over"\n                        if cand_post_terminal is not None\n                        else "play_move",\n                        "post_position": {\n'''
          identity_repl = '''                        "recommended_action": "game_over"\n                        if cand_post_terminal is not None\n                        else "play_move",\n                        "build_sha": _build_sha(),\n                        "engine_config": _engine_config(pool),\n                        "post_position": {\n'''
          if identity_needle in s:
              s = replace_once(s, identity_needle, identity_repl, 'candidate identity')

          # Enable the official SDK's Host/Origin protection instead of opting out.
          security_old = '''    from starlette.middleware.gzip import GZipMiddleware\n\n    security = TransportSecuritySettings(enable_dns_rebinding_protection=False)\n    base = mcp.streamable_http_app(transport_security=security)\n'''
          security_new = '''    from starlette.middleware.gzip import GZipMiddleware\n    from .config import get_mcp_settings\n\n    cfg = get_mcp_settings()\n    split_csv = lambda value: [item.strip() for item in value.split(",") if item.strip()]\n    security = TransportSecuritySettings(\n        enable_dns_rebinding_protection=cfg.dns_rebinding_protection,\n        allowed_hosts=split_csv(cfg.allowed_hosts),\n        allowed_origins=split_csv(cfg.allowed_origins),\n    )\n    base = mcp.streamable_http_app(transport_security=security)\n'''
          if security_old in s:
              s = replace_once(s, security_old, security_new, 'DNS rebinding settings')

          p.write_text(s, encoding='utf-8')

          # 3. Production/development settings.
          p = Path('.env.example')
          s = p.read_text(encoding='utf-8')
          if 'CHESS_MCP_DNS_REBINDING_PROTECTION' not in s:
              insert = '''\n# MCP HTTP Host/Origin validation. Keep enabled on every public deployment.\nCHESS_MCP_DNS_REBINDING_PROTECTION=true\nCHESS_MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:*,[::1]:*,testserver,testserver:*\n# Origin may be absent for server-to-server clients. If present it must match.\nCHESS_MCP_ALLOWED_ORIGINS=http://localhost:*,http://127.0.0.1:*\n'''
              anchor = 'CHESS_MCP_LOCK_CHATGPT=true\n'
              s = replace_once(s, anchor, anchor + insert, '.env security')
              p.write_text(s, encoding='utf-8')

          p = Path('docker-compose.prod.yml')
          s = p.read_text(encoding='utf-8')
          if 'CHESS_MCP_DNS_REBINDING_PROTECTION' not in s:
              anchor = '      - CHESS_MCP_LOCK_CHATGPT=true\n'
              add = '''      - CHESS_MCP_DNS_REBINDING_PROTECTION=true\n      - CHESS_MCP_ALLOWED_HOSTS=mcp.trychessy.com,mcp.trychessy.com:*,mcp,mcp:8000,localhost:*,127.0.0.1:*\n      - CHESS_MCP_ALLOWED_ORIGINS=https://chatgpt.com,https://chat.openai.com,https://platform.openai.com,http://mcp.trychessy.com,https://mcp.trychessy.com\n'''
              s = replace_once(s, anchor, anchor + add, 'compose security')
              p.write_text(s, encoding='utf-8')

          # 4. Remove stale operational claims from Caddy/README.
          p = Path('Caddyfile')
          s = p.read_text(encoding='utf-8')
          old = '''#  * flush_interval -1    — flush each SSE chunk to the client immediately.\n#                           Critical for multi-position analyze_game responses\n#                           where the client wants incremental progress, not a\n#                           75s buffer until the last move completes.\n'''
          new = '''#  * flush_interval -1    - avoid proxy buffering for streamable HTTP/SSE\n#                           traffic. analyze_game currently returns one completed\n#                           tool result; this does not imply per-position progress.\n'''
          if old in s:
              s = replace_once(s, old, new, 'Caddy progress comment')
              p.write_text(s, encoding='utf-8')

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '''- **Stockfish pool size** defaults to `min(cpu_count, 8)` — sized to the\n  OVH production box (8 cores Xeon E5-1620 v2).\n'''
          new = '''- **Stockfish pool size** defaults to `min(cpu_count, 4)` when not explicitly\n  configured. Production pins 4 workers with 2 Stockfish threads each.\n'''
          if old in s:
              s = replace_once(s, old, new, 'README pool default')
              p.write_text(s, encoding='utf-8')

          # 5. Permanent regressions for the residual v1-v3 findings.
          p = Path('tests/test_ultra_stress_v5.py')
          s = p.read_text(encoding='utf-8')
          marker = 'test_residual_dns_rebinding_settings_are_enforced'
          if marker not in s:
              s += r'''

# Residual audit closure: findings present in v1-v3 but not explicit in the v4 41-test map.
def test_residual_dns_rebinding_settings_are_enforced(monkeypatch):
    from mcp.server.transport_security import TransportSecurityMiddleware
    from mcp_server.config import get_mcp_settings

    monkeypatch.setenv("CHESS_MCP_DNS_REBINDING_PROTECTION", "true")
    monkeypatch.setenv("CHESS_MCP_ALLOWED_HOSTS", "mcp.trychessy.com,localhost:*")
    monkeypatch.setenv("CHESS_MCP_ALLOWED_ORIGINS", "https://chatgpt.com")
    get_mcp_settings.cache_clear()
    try:
        settings = server_module._build_app.__globals__["TransportSecuritySettings"](
            enable_dns_rebinding_protection=get_mcp_settings().dns_rebinding_protection,
            allowed_hosts=["mcp.trychessy.com", "localhost:*"],
            allowed_origins=["https://chatgpt.com"],
        )
        middleware = TransportSecurityMiddleware(settings)
        assert middleware._validate_host("mcp.trychessy.com") is True
        assert middleware._validate_host("localhost:8000") is True
        assert middleware._validate_host("attacker.example") is False
        assert middleware._validate_origin("https://chatgpt.com") is True
        assert middleware._validate_origin("https://evil.example") is False
    finally:
        get_mcp_settings.cache_clear()


@pytest.mark.asyncio
async def test_residual_position_tools_reject_moves_after_automatic_terminal():
    bad = "1. f3 e5 2. g4 Qh4# 3. e4"
    with pytest.raises(ToolError, match="INVALID_PGN"):
        await server_module.evaluate_position(bad, depth=1)
    with pytest.raises(ToolError, match="INVALID_PGN"):
        await server_module.top_moves(bad, n=1, depth=1)
    with pytest.raises(ToolError, match="INVALID_PGN"):
        await server_module.classify_move(bad, "e4", depth=1)


@pytest.mark.asyncio
async def test_residual_analyze_game_warns_permissive_and_rejects_strict_trailing_move():
    bad = "1. f3 e5 2. g4 Qh4# 3. e4"
    permissive = await server_module.analyze_game(bad, depth=1, strict=False)
    assert permissive.total_plies == 4
    assert any("after game termination" in w for w in permissive.metadata_warnings)
    with pytest.raises(ToolError, match="INVALID_PGN"):
        await server_module.analyze_game(bad, depth=1, strict=True)


@pytest.mark.asyncio
async def test_residual_nested_candidates_share_outer_build_identity():
    result = await server_module.top_moves("startpos", n=3, depth=1)
    assert result.result
    for candidate in result.result:
        assert candidate.build_sha == result.build_sha
        assert candidate.engine_config == result.engine_config
    cached = await server_module.top_moves("startpos", n=3, depth=1)
    for candidate in cached.result:
        assert candidate.build_sha == cached.build_sha
        assert candidate.engine_config == cached.engine_config
'''
              p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Commit residual audit closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_server/config.py mcp_server/server.py .env.example docker-compose.prod.yml Caddyfile README.md tests/test_ultra_stress_v5.py
          git commit -m "fix: close residual Chess MCP audit findings [residual-audit-applied]"
          git push origin HEAD:test/chess-mcp-ultra-stress-v5-2026-08-30
