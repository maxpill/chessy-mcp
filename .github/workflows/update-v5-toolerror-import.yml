name: Update v5 ToolError import

on:
  push:
    branches:
      - test/chess-mcp-ultra-stress-v5-2026-08-30

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[v5-toolerror-imported]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/chess-mcp-ultra-stress-v5-2026-08-30
      - name: Add ToolError import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_mcp_ultra_audit_fixtures_2026_08_28.py')
          s = p.read_text(encoding='utf-8')
          needle = 'import chess\nimport pytest\n\n'
          repl = 'import chess\nimport pytest\nfrom mcp.server.mcpserver.exceptions import ToolError\n\n'
          if needle not in s:
              raise SystemExit('import insertion point not found')
          p.write_text(s.replace(needle, repl, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit import
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_mcp_ultra_audit_fixtures_2026_08_28.py
          git commit -m "test: import ToolError for structured verbosity regression [v5-toolerror-imported]"
          git push origin HEAD:test/chess-mcp-ultra-stress-v5-2026-08-30
