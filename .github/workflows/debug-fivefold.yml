name: Debug fivefold semantics

on:
  push:
    branches:
      - fix/chess-mcp-ultra-audit-2026-08-30

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check uv
      - run: uv sync --frozen --dev
      - name: Inspect repetition semantics
        run: |
          uv run python - <<'PY'
          import chess
          from mcp_server.rules import evaluate_rule_status
          b = chess.Board()
          seq = ["Nf3", "Nf6", "Ng1", "Ng8"] * 4
          for i, san in enumerate(seq, 1):
              b.push_san(san)
              if i % 4 == 0:
                  print(i, "rep3", b.is_repetition(3), "rep5", b.is_repetition(5), "five", b.is_fivefold_repetition(), "gameover", b.is_game_over(claim_draw=False), "status", evaluate_rule_status(b, history_complete="complete").terminal)
          print("final fen", b.fen())
          print("outcome", b.outcome(claim_draw=False))
          PY
