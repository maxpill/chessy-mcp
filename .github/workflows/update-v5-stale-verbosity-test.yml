name: Update stale verbosity regression

on:
  push:
    branches:
      - test/chess-mcp-ultra-stress-v5-2026-08-30

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[v5-stale-test-updated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/chess-mcp-ultra-stress-v5-2026-08-30
      - name: Update stale public-error expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_mcp_ultra_audit_fixtures_2026_08_28.py')
          s = p.read_text(encoding='utf-8')
          old = '''    # Unknown values are rejected instead of silently changing semantics.\n    with pytest.raises(ValueError, match="INVALID_VERBOSITY"):\n        await server_module.evaluate_position("startpos", depth=10, verbosity="unknown-mode")\n'''
          new = '''    # Public tools normalize validation failures into structured ToolError.\n    with pytest.raises(ToolError, match="INVALID_VERBOSITY"):\n        await server_module.evaluate_position("startpos", depth=10, verbosity="unknown-mode")\n'''
          if old not in s:
              raise SystemExit('stale verbosity test block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -n -A4 -B2 'unknown-mode' tests/test_mcp_ultra_audit_fixtures_2026_08_28.py
          git diff --check
      - name: Commit test contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_mcp_ultra_audit_fixtures_2026_08_28.py
          git commit -m "test: expect structured invalid verbosity error [v5-stale-test-updated]"
          git push origin HEAD:test/chess-mcp-ultra-stress-v5-2026-08-30
