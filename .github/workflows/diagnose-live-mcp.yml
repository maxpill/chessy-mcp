name: Diagnose live MCP

on:
  push:
    branches:
      - diag/live-mcp-2026-08-30
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS and public edge probes
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          getent ahosts mcp.trychessy.com || true
          getent ahosts webhook-komodo.trychessy.com || true
          echo '=== MCP health ==='
          curl -sSvk --max-time 15 -D - https://mcp.trychessy.com/health -o /tmp/health.body
          cat /tmp/health.body || true
          echo
          echo '=== MCP GET ==='
          curl -sSvk --max-time 15 -D - https://mcp.trychessy.com/mcp -o /tmp/mcp.body
          cat /tmp/mcp.body || true
          echo
          echo '=== Komodo webhook host GET only ==='
          curl -sSvk --max-time 15 -D - https://webhook-komodo.trychessy.com/listener/github/stack/chessy-mcp/deploy -o /tmp/hook.body
          cat /tmp/hook.body || true
          echo

      - name: Retry Komodo deploy if webhook secret is available
        env:
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KOMODO_WEBHOOK_SECRET:-}" ]; then
            echo 'KOMODO_WEBHOOK_SECRET is not configured as an Actions secret; not sending a deploy request.'
            exit 0
          fi
          payload='{"ref":"refs/heads/main","repository":{"full_name":"maxpill/chessy-mcp"}}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" -hex | awk '{print $2}')"
          code=$(curl -sS --max-time 20 -o /tmp/deploy.body -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -H "X-Hub-Signature-256: $signature" \
            --data "$payload" \
            https://webhook-komodo.trychessy.com/listener/github/stack/chessy-mcp/deploy)
          echo "Komodo deploy endpoint HTTP $code"
          cat /tmp/deploy.body || true
          test "$code" = '200'
