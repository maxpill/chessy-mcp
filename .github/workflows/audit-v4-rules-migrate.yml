name: Apply audit v4 semantic migrations

on:
  push:
    branches:
      - fix/chess-mcp-ultra-audit-2026-08-30

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[audit-v4-migrations-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply migrations
        run: |
          python scripts/apply_audit_v4_rules.py
          python scripts/apply_audit_v4_semantics.py
          python scripts/apply_audit_v4_server.py
      - name: Compile changed modules
        run: >-
          python -m py_compile
          mcp_server/rules.py
          mcp_server/actions.py
          mcp_server/models.py
          mcp_server/cache.py
          mcp_server/server.py
      - name: Commit migrations
        shell: bash
        run: |
          if git diff --quiet -- mcp_server/rules.py mcp_server/models.py mcp_server/cache.py mcp_server/server.py; then
            echo "No migration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+maxpill@users.noreply.github.com"
          git add mcp_server/rules.py mcp_server/models.py mcp_server/cache.py mcp_server/server.py
          git commit -m "fix: audit v4 server and semantic invariants [audit-v4-migrations-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
