name: Apply ultra stress v5 fixes

on:
  push:
    branches:
      - test/chess-mcp-ultra-stress-v5-2026-08-30

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stress-v5-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/chess-mcp-ultra-stress-v5-2026-08-30

      - name: Apply fixes exposed by stress matrix
        run: python scripts/apply_ultra_stress_v5_fixes.py

      - name: Verify patch changed expected files
        run: |
          git diff --check
          git diff -- mcp_server/server.py tests/test_ultra_stress_v5.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_server/server.py tests/test_ultra_stress_v5.py
          git commit -m "fix: close stress v5 validation gaps [stress-v5-applied]"
          git push origin HEAD:test/chess-mcp-ultra-stress-v5-2026-08-30
