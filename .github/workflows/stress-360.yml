name: Chess MCP 360-call stress

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public MCP base URL to stress
        required: true
        default: https://mcp.trychessy.com
        type: string
      expected_sha:
        description: Expected deployed git SHA; leave blank to use the workflow commit SHA
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/stress-360.yml"

concurrency:
  group: chess-mcp-stress-360-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress-360:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_URL: ${{ inputs.target_url || 'https://mcp.trychessy.com' }}
      EXPECTED_SHA_INPUT: ${{ inputs.expected_sha || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv and runtime dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen

      - name: Resolve expected deployment SHA
        id: deployment
        shell: bash
        run: |
          if [ -n "$EXPECTED_SHA_INPUT" ]; then
            expected="$EXPECTED_SHA_INPUT"
          else
            expected="${GITHUB_SHA}"
          fi
          echo "expected_sha=$expected" >> "$GITHUB_OUTPUT"
          echo "Expected deployment SHA: $expected"

      - name: Run 360-call stress harness
        id: stress
        shell: bash
        run: |
          set -o pipefail
          uv run python scripts/production_stress_360.py \
            --target "$TARGET_URL" \
            --expected-sha "${{ steps.deployment.outputs.expected_sha }}" \
            --jsonl-out artifacts/chess_mcp_stress_360.jsonl \
            --md-out artifacts/chess_mcp_stress_360.md 2>&1 | tee stress-360.log

      - name: Write stress summary to job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Chess MCP 360-call stress summary"
            echo
            echo "Target: \`$TARGET_URL\`"
            echo "Expected SHA: \`${{ steps.deployment.outputs.expected_sha }}\`"
            echo
            echo '```text'
            if [ -f artifacts/chess_mcp_stress_360.md ]; then
              cat artifacts/chess_mcp_stress_360.md
            else
              echo "Stress harness did not produce a Markdown summary."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-mcp-stress-360-${{ github.run_id }}
          path: |
            artifacts/chess_mcp_stress_360.jsonl
            artifacts/chess_mcp_stress_360.md
            stress-360.log
          if-no-files-found: warn
          retention-days: 14
