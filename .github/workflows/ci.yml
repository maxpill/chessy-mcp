name: Chess MCP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chess-mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv and dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen --dev

      - name: Compile
        run: uv run python -m compileall -q mcp_server core tests

      - name: Ruff
        run: uv run ruff check mcp_server core

      - name: Pyright
        run: uv run pyright mcp_server core

      - name: Validate production edge config
        env:
          CHESS_MCP_AUTH_TOKEN: ci-edge-token
        run: |
          docker run --rm \
            -e CHESS_MCP_AUTH_TOKEN="$CHESS_MCP_AUTH_TOKEN" \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker compose -f docker-compose.prod.yml config >/dev/null
