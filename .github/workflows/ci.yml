name: Chess MCP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: chess-mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_SHA: ${{ github.sha }}
      STOCKFISH_PATH: /usr/games/stockfish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv, Stockfish and dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          test -x "$STOCKFISH_PATH"
          uv sync --frozen --dev

      - name: Compile
        run: uv run python -m compileall -q mcp_server core tests scripts

      - name: Ruff
        run: uv run ruff check mcp_server core

      - name: Pyright engine pool
        run: uv run pyright core/engines/pool.py

      - name: Engine transport regression
        run: uv run pytest -q tests/test_p1_transport_recovery.py

      - name: Pyright
        run: uv run pyright mcp_server core

      - name: Full pytest suite
        run: uv run pytest -q

      - name: Validate production edge config
        env:
          CHESS_MCP_AUTH_TOKEN: ci-edge-token
        run: |
          docker run --rm \
            -e CHESS_MCP_AUTH_TOKEN="$CHESS_MCP_AUTH_TOKEN" \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
          docker compose -f docker-compose.prod.yml config >/dev/null
