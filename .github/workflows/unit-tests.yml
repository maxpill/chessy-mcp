name: Chess MCP Unit Tests

on:
  workflow_dispatch:

concurrency:
  group: chess-mcp-unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STOCKFISH_PATH: /usr/games/stockfish
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv and Stockfish
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          test -x "$STOCKFISH_PATH"
          uv sync --frozen --dev

      - name: Run unit tests
        run: uv run pytest -q
