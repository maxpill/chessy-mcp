name: Apply audit v4 test hardening

on:
  push:
    branches:
      - fix/chess-mcp-ultra-audit-2026-08-30

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-v4-tests-applied]') }}
    runs-on: ubuntu-latest
    env:
      STOCKFISH_PATH: /usr/games/stockfish
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv and Stockfish
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          uv sync --frozen --dev
      - name: Apply hardened regressions
        run: python scripts/apply_audit_v4_test_hardening.py
      - name: Keep post-castle rook on f1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_mcp_ultra_audit_fixtures_2026_08_28.py")
          text = p.read_text()
          old = 'pgn = f"1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. {san} Be7 5. Re1 {san} *"'
          new = 'pgn = f"1. e4 e5 2. Nf3 Nc6 3. Bc4 Nf6 4. {san} Be7 5. d3 {san} *"'
          if old not in text:
              raise SystemExit("castling fixture line not found")
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Compile
        run: uv run python -m compileall -q mcp_server core tests
      - name: Hardened tests
        run: uv run pytest -q tests/test_mcp_ultra_audit_fixtures_2026_08_28.py -k 'r_18 or r_19 or r_21 or r_44'
      - name: Full pytest
        run: uv run pytest -q
      - name: Ruff production
        run: uv run ruff check mcp_server core
      - name: Strict Pyright
        run: uv run pyright mcp_server core
      - name: Commit hardened tests and parser fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_server/server.py tests/test_mcp_ultra_audit_fixtures_2026_08_28.py
          if git diff --cached --quiet; then
            echo "No change required"
            exit 0
          fi
          git commit -m "fix: close audit v4 parser and ranking regressions [audit-v4-tests-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
