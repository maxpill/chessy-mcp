name: Chess MCP Extra Ultra 160

on:
  push:
    branches:
      - audit/ultra-extra160-2026-09-09

permissions:
  contents: read

concurrency:
  group: chess-mcp-extra-ultra-160
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --frozen

      - name: Patch audit harness for mcp 2.1 Tool field naming
        shell: bash
        run: |
          sed -i 's/inputSchema/input_schema/g' scripts/production_ultra_additional_160.py
          python -m py_compile scripts/production_ultra_additional_160.py

      - name: Run 160 additional harder direct MCP calls
        id: extra160
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          uv run python scripts/production_ultra_additional_160.py \
            --target https://mcp.trychessy.com \
            --output-dir artifacts > artifacts/extra160-console.log 2>&1
          code=$?
          set -e
          cat artifacts/extra160-console.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Write accounting
        if: always()
        shell: bash
        run: |
          cat > artifacts/extra160_accounting.md <<EOF
          # Chess MCP additional 160 call accounting

          - Intended exact direct session.call_tool calls: 160
          - Harness exit code: ${{ steps.extra160.outputs.exit_code }}
          - Branch: audit/ultra-extra160-2026-09-09
          - Production source build expected: a1a05f43888ab959b5a95af2a112b18847c436fe
          EOF
          find artifacts -maxdepth 1 -type f -print | sort

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-mcp-extra-ultra-160-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
