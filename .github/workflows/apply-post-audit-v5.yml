name: Apply post-audit v5 fixes

on:
  push:
    branches:
      - fix/chess-mcp-post-audit-v5-2026-08-30

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[post-audit-v5-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STOCKFISH_PATH: /usr/games/stockfish
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chess-mcp-post-audit-v5-2026-08-30

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv and Stockfish
        run: |
          python -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          uv sync --frozen --dev

      - name: Apply fixes and regressions
        run: uv run python scripts/apply_post_audit_v5.py

      - name: Compile
        run: uv run python -m compileall -q mcp_server core tests

      - name: Ruff
        run: uv run ruff check mcp_server core

      - name: V5 regressions
        run: uv run pytest -q tests/test_post_audit_v5.py

      - name: Full pytest
        run: uv run pytest -q

      - name: Strict Pyright
        run: uv run pyright mcp_server core

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_server/models.py mcp_server/server.py tests/test_post_audit_v5.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: harden procedural claims and HTTP admission [post-audit-v5-applied]"
          git push origin HEAD:fix/chess-mcp-post-audit-v5-2026-08-30
