# Production stack for chessy-mcp - a single MCP service backed by a
# single Stockfish sidecar, fronted by Caddy on the public hostname.
#
# Compose is built (not pulled) - Komodo runs `docker compose -f
# docker-compose.prod.yml up -d --build --remove-orphans` on every push to
# maxpill/chessy-mcp:main. Public webhook URL:
#   https://webhook-komodo.trychessy.com/listener/github/stack/chessy-mcp/deploy
#
# BUILD_SHA and CHESSY_PACKAGE_VERSION are stamped into the stack .env by
# scripts/deploy-helper.sh, which the Komodo stack runs as pre_deploy.
# Both are baked into the image (build arg) and passed at runtime so every
# MCP response exposes the deployment identity even though .git is not in
# the image.

name: chessy-mcp

services:
  stockfish:
    build:
      context: .
      dockerfile: Dockerfile.stockfish
    restart: unless-stopped
    volumes:
      - /etc/komodo/stacks/chessy-mcp/syzygy:/syzygy:ro
    networks:
      - mcp-net
    expose:
      - "9550"
    healthcheck:
      test: ["CMD", "stockfish", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
        CHESSY_PACKAGE_VERSION: ${CHESSY_PACKAGE_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      stockfish:
        condition: service_healthy
    tmpfs:
      - /cache:size=64m
    environment:
      - CHESS_MCP_TRANSPORT=streamable-http
      - CHESS_MCP_HOST=0.0.0.0
      - CHESS_MCP_PORT=8000
      - CHESS_MCP_LOCK_CHATGPT=true
      - CHESS_MCP_POOL_SIZE=4
      - CHESS_MCP_MAX_CONCURRENT_EVALUATES=8
      - STOCKFISH_HASH_MB=64
      - STOCKFISH_THREADS_PER_WORKER=2
      - STOCKFISH_HOST=stockfish
      - STOCKFISH_PORT=9550
      - CHESS_MCP_CACHE_DB=/cache/chess_mcp_eval_cache.sqlite3
      - CHESS_MCP_POOL_STATS_INTERVAL_S=30
      - CHESS_MCP_SHOW_WDL=true
      - CHESS_MCP_PONDER_ENABLED=false
      - CHESS_MCP_SYZYGY_PATH=/syzygy
      - CHESS_MCP_AUTH_TOKEN=${CHESS_MCP_AUTH_TOKEN:-}
      - BUILD_SHA=${BUILD_SHA:-unknown}
      - CHESSY_PACKAGE_VERSION=${CHESSY_PACKAGE_VERSION:-0.1.0}
      - LOG_LEVEL=INFO
    networks:
      - mcp-net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      mcp:
        condition: service_healthy
    ports:
      - "127.0.0.1:9551:80"
    environment:
      # The edge injects this secret only for OpenAI/ChatGPT-identified traffic.
      # It must be the same value used by the token-only MCP middleware above.
      - CHESS_MCP_AUTH_TOKEN=${CHESS_MCP_AUTH_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mcp-net

networks:
  mcp-net:
    driver: bridge
    name: chessy-mcp-net

volumes:
  caddy_data:
  caddy_config:
